---

root: true

plugins:
  - jest

env:
  node: true
  es2020: true

parserOptions:
  ecmaVersion: 2020
  sourceType: module

extends:
  - 'airbnb-base'
  - 'plugin:jest/recommended'

overrides:
  - files:
      - 'test/**'
    env:
      jest: true

rules:
  import/extensions: 0
  import/no-extraneous-dependencies: [error, { devDependencies: true }]
